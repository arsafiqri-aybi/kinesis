name: Bug report
description: Report a reproducible issue in Kinesis
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed and expected results.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Include a minimal scene or code sample.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime
      description: Node version, OS, FFmpeg version, and renderer backend.
    validations:
      required: true

